# Netlify build configuration for this Next.js app.
# Netlify auto-detects Next.js and applies its official runtime even
# without this file, but pinning it explicitly here keeps the build
# reproducible and self-documenting.
#
# Set the three environment variables from .env.example in
# Netlify -> Site configuration -> Environment variables before your
# first deploy (Build & runtime scopes -> "Same value for all deploy
# contexts" is fine for this app).

[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"
